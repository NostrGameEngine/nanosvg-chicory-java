name: Maven Central Release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      version:
        description: Release version to stage, without -SNAPSHOT
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LLVM tools
        run: sudo apt-get update && sudo apt-get install -y clang lld

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Resolve release version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
          else
            VERSION="${{ inputs.version }}"
          fi
          VERSION="${VERSION#v}"
          case "$VERSION" in
            *-SNAPSHOT)
              echo "Release version must not end with -SNAPSHOT" >&2
              exit 1
              ;;
          esac
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Upload and close staging repository
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: ./gradlew --no-daemon clean build publishToSonatype closeSonatypeStagingRepository -PreleaseVersion="$RELEASE_VERSION" --console=plain
