plugins {
    id 'java-library'
    id 'application'
    id 'maven-publish'
    id 'signing'
    id 'io.github.gradle-nexus.publish-plugin' version '2.0.0'
    alias(libs.plugins.wasm2class)
    alias(libs.plugins.teavm)
}

group = 'org.ngengine'
version = providers.gradleProperty('releaseVersion').orElse('0.1.0-SNAPSHOT').get()

repositories {
    mavenCentral()
    mavenLocal()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
    withJavadocJar()
}

sourceSets {
    teavm {
        java.srcDirs = ['src/test/teavm/java']
        resources.srcDirs = [
                'src/test/teavm/resources',
                layout.buildDirectory.dir('generated-chicory/java/resources').get().asFile
        ]
    }
}

tasks.named('compileJava', JavaCompile) {
    options.release = 11
}

tasks.named('compileTestJava', JavaCompile) {
    options.release = 21
}

tasks.matching { it.name == 'compileTeavmJava' }.configureEach {
    if (it instanceof JavaCompile) {
        it.options.release = 11
    }
}

tasks.named('test', Test) {
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
    failOnNoDiscoveredTests = false
}

def generatedWasm = layout.buildDirectory.file('generated/wasm/nanosvg.wasm')

dependencies {
    api libs.chicory.runtime
    implementation libs.chicory.wasm
    teavmImplementation libs.teavm.jso
    teavmImplementation libs.teavm.jso.apis
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
            artifactId = 'nanosvg-chicory-java'

            pom {
                name = 'nanosvg-chicory-java'
                description = 'NanoSVG compiled to WebAssembly and exposed as a Java library through Chicory.'
                url = 'https://github.com/NostrGameEngine/nanosvg-chicory-java'
                licenses {
                    license {
                        name = 'zlib License'
                        url = 'https://opensource.org/license/zlib'
                    }
                }
                developers {
                    developer {
                        id = 'ngengine'
                        name = 'Nostr Game Engine'
                    }
                }
                scm {
                    connection = 'scm:git:https://github.com/NostrGameEngine/nanosvg-chicory-java.git'
                    developerConnection = 'scm:git:ssh://git@github.com/NostrGameEngine/nanosvg-chicory-java.git'
                    url = 'https://github.com/NostrGameEngine/nanosvg-chicory-java'
                }
            }
        }
    }
    repositories {
        maven {
            name = 'sonatypeSnapshots'
            url = uri('https://central.sonatype.com/repository/maven-snapshots/')
            credentials {
                username = providers.gradleProperty('sonatypeUsername')
                        .orElse(providers.environmentVariable('SONATYPE_USERNAME'))
                        .orNull
                password = providers.gradleProperty('sonatypePassword')
                        .orElse(providers.environmentVariable('SONATYPE_PASSWORD'))
                        .orNull
            }
        }
    }
}

signing {
    def signingKey = providers.gradleProperty('signingInMemoryKey')
            .orElse(providers.environmentVariable('GPG_PRIVATE_KEY'))
            .orNull
    def signingPassword = providers.gradleProperty('signingInMemoryKeyPassword')
            .orElse(providers.environmentVariable('GPG_PASSPHRASE'))
            .orNull

    required {
        gradle.taskGraph.allTasks.any {
            it.name.toLowerCase().contains('publish')
        }
    }
    useInMemoryPgpKeys(signingKey, signingPassword)
    sign publishing.publications.maven
}

nexusPublishing {
    repositories {
        sonatype {
            nexusUrl = uri('https://ossrh-staging-api.central.sonatype.com/service/local/')
            snapshotRepositoryUrl = uri('https://central.sonatype.com/repository/maven-snapshots/')
            username = providers.gradleProperty('sonatypeUsername')
                    .orElse(providers.environmentVariable('SONATYPE_USERNAME'))
                    .orNull
            password = providers.gradleProperty('sonatypePassword')
                    .orElse(providers.environmentVariable('SONATYPE_PASSWORD'))
                    .orNull
        }
    }
}

tasks.register('compileNanosvgWasm', Exec) {
    group = 'build'
    description = 'Compile NanoSVG wrapper to freestanding Wasm'

    inputs.files(
            'src/wasm/c/mini_libc.c',
            'src/wasm/c/nanosvg_wrapper.c',
            'third_party/nanosvg/src/nanosvg.h',
            'third_party/nanosvg/src/nanosvgrast.h'
    )
    outputs.file(generatedWasm)

    doFirst {
        def pathEntries = (System.getenv('PATH') ?: '').split(File.pathSeparator)
        def hasCommand = { String name ->
            pathEntries.any { entry -> new File(entry, name).canExecute() }
        }

        if (!hasCommand('clang')) {
            throw new GradleException(
                    'Missing `clang` in PATH. Install an LLVM/Clang toolchain with wasm32 support.'
            )
        }

        def hasWasmLinker = hasCommand('wasm-ld') || hasCommand('ld.lld')
        if (!hasWasmLinker) {
            throw new GradleException(
                    'Missing WebAssembly linker (`wasm-ld` or `ld.lld`) in PATH. ' +
                            'Install LLVM LLD (for example package `lld` on Fedora/Debian/Ubuntu).'
            )
        }

        generatedWasm.get().asFile.parentFile.mkdirs()
    }

    commandLine(
            'clang',
            '--target=wasm32-unknown-unknown',
            '-O2',
            '-nostdlib',
            '-ffreestanding',
            '-fno-builtin',
            '-Wl,--no-entry',
            '-Wl,--export-memory',
            '-Wl,--initial-memory=16777216',
            '-Wl,--max-memory=16777216',
            '-Wl,--allow-undefined',
            '-Wl,--export=wasm_alloc',
            '-Wl,--export=wasm_reset',
            '-Wl,--export=nsvg_render_rgba',
            '-Wl,--export=nsvg_get_last_output_ptr',
            '-Wl,--export=nsvg_get_last_output_size',
            '-Wl,--export=nsvg_get_last_width',
            '-Wl,--export=nsvg_get_last_height',
            '-Wl,--export=nsvg_get_last_stride',
            '-I', 'src/wasm/include',
            '-I', 'third_party/nanosvg/src',
            'src/wasm/c/mini_libc.c',
            'src/wasm/c/nanosvg_wrapper.c',
            '-o', generatedWasm.get().asFile.absolutePath
    )
}

wasm2class {
    targetPackage = 'org.ngengine.nanosvg.wasm'
    modules {
        create('nanosvg') {
            wasm = generatedWasm.get().asFile
        }
    }
}

tasks.named('classes') {
    dependsOn 'compileNanosvgWasm'
}

tasks.matching {
    it.name.toLowerCase().contains('wasm') && it.name != 'compileNanosvgWasm'
}.configureEach {
    dependsOn 'compileNanosvgWasm'
}

tasks.named('processResources') {
    dependsOn 'compileNanosvgWasm'
}

application {
    mainClass = 'org.ngengine.nanosvg.NanoSvgDemo'
}

teavm {
    all {
        mainClass = 'org.ngengine.nanosvg.NanoSvgTeaVmDemo'
        outputDir = layout.buildDirectory.dir('teavm')
    }
    js {
        targetFileName = 'nanosvg-teavm.js'
        relativePathInOutputDir = '.'
        obfuscated = false
        sourceMap = true
        entryPointName = 'main'
    }
}

tasks.named('generateJavaScript') {
    dependsOn 'classes'
    finalizedBy 'copyTeaVmWebAssets'
}

tasks.named('processTeavmResources') {
    dependsOn 'precompileWasm2Class'
}

tasks.register('copyTeaVmWebAssets', Copy) {
    dependsOn 'processTeavmResources'
    from 'src/test/teavm/web'
    from(layout.buildDirectory.file('resources/teavm/org/ngengine/nanosvg/wasm/Nanosvg.meta')) {
        into '.'
    }
    into layout.buildDirectory.dir('teavm')
}

tasks.register('teavmBrowserDemo') {
    group = 'verification'
    description = 'Builds TeaVM JavaScript demo and copies index.html to build/teavm'
    dependsOn 'generateJavaScript', 'copyTeaVmWebAssets'
}

tasks.register('awtDragDropTest', JavaExec) {
    group = 'verification'
    description = 'Runs the manual AWT drag-and-drop SVG rendering test harness'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.ngengine.nanosvg.NanoSvgAwtDragDropTest'
    dependsOn 'testClasses'
}

tasks.register('refreshCatalog') {
    group = 'build setup'
    description = 'Downloads the central NostrGameEngine Gradle version catalog.'

    def catalogUrl = providers.gradleProperty('centralCatalogUrl')
        .orElse('https://raw.githubusercontent.com/NostrGameEngine/libs.catalog/main/libs.versions.toml')
    def outputFile = layout.projectDirectory.file('gradle/libs.versions.toml')

    outputs.file(outputFile)

    doLast {
        def target = outputFile.asFile
        target.parentFile.mkdirs()
        target.text = new URI(catalogUrl.get()).toURL().getText('UTF-8')
        println "Refreshed ${target}"
    }
}
